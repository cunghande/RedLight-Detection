# Cấu hình luồng video; notebook huấn luyện dùng cấu hình riêng.
general:
  output_dir: violations

camera:
  cache_dir: configs
  stabilization_enabled: false

models:
  vehicle_detector:
    weights: weights/yolo11x.pt
    conf: 0.35
    tracker: bytetrack.yaml
    track_names: [bicycle, car, motorcycle, bus, truck]
  traffic_light:
    weights: weights/yolov8s.pt  # COCO pretrained, class 9 là traffic light
    conf: 0.25
    max_missing_frames: 10

stopline_detector:
  classical:
    sample_frames: 200
    roi:
      y_min_ratio: 0.45
      y_max_ratio: 0.82
    scoring_weights:
      angle_perpendicular: 0.30
      trajectory_intersection: 0.25
      stopped_cluster_distance: 0.20
      relative_length: 0.15
      paint_contrast: 0.10
    selection:
      min_confidence_thresh: 0.52
      top_k_candidates: 5
      max_lines: 2
      secondary_distance_thresh: 48

stabilization:
  method: ORB
  max_features: 1000

violation_logic:
  min_violation_frames: 3
  allow_right_turn: false
  right_turn_x_ratio: 0.75
